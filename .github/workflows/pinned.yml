name: Pinned Projects

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/pinned.py"
      - ".github/workflows/pinned.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pinned.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "pinned-bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Sync pinned projects"
            git push
          else
            echo "index.html unchanged"
          fi
